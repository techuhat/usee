# Monthly dependency updates (docs/dependency-management.md). Electron and
# electron-builder arrive on their own, since each needs a focused review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Node's types follow the Node major usee runs on (22), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A TypeScript major waits until typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [electron, electron-builder]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
