# Monthly dependency updates (docs/dependency-management.md). Electron and
# electron-builder arrive on their own, since each needs a focused review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [electron, electron-builder]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
